<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>SQL-IDE · GSG Osnabrück</title>
    <link rel="icon" type="image/png" href="assets/graphics/gsg/favicon-64.png">
    <link rel="apple-touch-icon" href="assets/graphics/gsg/apple-touch-icon.png">
    <meta name="theme-color" content="#00376D">
    <meta name='viewport' content='width=device-width, initial-scale=1'>



    <link rel='stylesheet' type='text/css' media='screen' href='assets/fonts/fonts.css'>

    <script type="module" src="src/client/main/IDEStarter.ts"></script>
</head>

<body class="joeCssFence">
    <!-- Helper-Box mit Erklärungen -->
    <div style="display: none;" class="jo_arrow_box jo_arrow_box_right">
        <div class="img_info-sign" style="width: 64px; height: 64px; float: left; margin-right: 15px"></div>
        <span></span>
        <div id="arrowBoxButtonOuter">
            <div class="jo_button jo_active">OK</div>
        </div>
    </div>

    <!-- Bitte-Warten-Text nach dem Logout (bis die Einstellungen gespeichert sind) -->
    <div class="bitteWarten">
        <div style="margin-bottom: 30px">
            <div class="bitteWartenText"></div>
        </div>
        <div>
            <img src="assets/graphics/grid.svg" alt="">
        </div>
        <div class="bitteWartenProgress"></div>
    </div>

    <!-- Login-Seite -->
    <!-- Login-Seite: angepasst für das Graf-Stauffenberg-Gymnasium Osnabrück (Stil: gsg-branding.css) -->
    <div id="login" class="gsg-login">
        <main class="gsg-login-main">
            <div class="gsg-login-card">
                <img class="gsg-login-logo" src="assets/graphics/gsg/logo-256.png"
                    alt="Logo des Graf-Stauffenberg-Gymnasiums Osnabrück" width="112" height="112">
                <h1 class="gsg-login-title">SQL-IDE</h1>
                <p class="gsg-login-school">Graf-Stauffenberg-Gymnasium Osnabrück</p>
                <div id="login-center">
                    <form onsubmit="return false">
                        <label class="gsg-sr-only" for="login-username">Benutzername</label>
                        <input id="login-username" type="text" placeholder="Benutzername" spellcheck="false"
                            autocomplete="username" autocapitalize="none" tabindex="1">
                        <label class="gsg-sr-only" for="login-password">Passwort</label>
                        <input id="login-password" type="password" placeholder="Passwort" spellcheck="false"
                            autocomplete="current-password" tabindex="2">
                        <div id="login-message" role="alert"></div>
                        <div id="login-button" role="button" tabindex="3">Anmelden</div>
                    </form>
                </div>
                <div id="login-spinner">
                    <img src="assets/graphics/ball-triangle.svg" alt="">
                </div>
            </div>
        </main>
        <footer id="login-footer">
            <div class="gsg-footer-school">Graf-Stauffenberg-Gymnasium Osnabrück</div>
            <div id="login-datenschutz">
                <a href="https://gsg-os.de/impressum/" target="_blank" rel="noopener">Impressum</a>
                <a href="https://gsg-os.de/datenschutzerklaerung/" target="_blank" rel="noopener">Datenschutz</a>
                <a href="https://github.com/EduTempel/online-ide" target="_blank" rel="noopener">Quellcode</a>
            </div>
            <div class="gsg-credits">
                Basiert auf der <a href="https://github.com/martin-pabst/SQL-IDE" target="_blank"
                    rel="noopener">SQL-IDE</a> von Martin Pabst (GNU GPL v3)
            </div>
        </footer>
    </div>

    <!-- Hauptseite -->

    <div id="main">
        <div id="code">
            <div id="mainmenu">
            </div>
            <div id="belowmainmenu">
                <div id="leftpanel">
                    <div id="slider1" class="slider" draggable="false"></div>
                    <div class="jo_projectexplorer">

                        <!-- Explorer and tabs are program generated by class Accordion -->

                    </div>
               </div>
                <div id="editoranderrors">
                    <div id="debugpanel">
                        <div id="view-mode">

                        </div>
                        <div id="controls">
                        </div>
                        <div id="buttonUserSettings" title="Benutzereinstellungen" style="margin-left: 32px"
                            class="img_user jo_button jo_active"></div>
                        <span id="menupanel-username" style="user-select: none">Tina Test</span>
                        <div id="buttonLogout" title="Logout" style="margin-left: 8px"
                            class="img_disconnect-dark jo_button jo_active"></div>
                    </div>
                    <div id="diffEditor"></div>
                    <div id="editor">
                        <!-- <div class="editButton" title="Programm anhalten damit der Programmtext bearbeitbar wird"></div> -->
                    </div>
                    <div id="bottomdiv-outer">
                        <div id="slider2" class="jo_slider" draggable="false"></div>
                        <div class="jo_bottomdiv-inner"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="rightdiv" class="jo_editorFontSize" draggable="false">
            <div id="slider3" class="jo_slider" draggable="false"></div>

            <div id="rightdiv-inner">

                <div class="jo_rightdiv-rightside-container">
                    <div class="img_whole-window jo_button jo_whole-window jo_active" alt="" style="margin-right: 8px;"
                        title="Auf Fenstergröße erweitern"></div>
                </div>

                <div class="jo_control-container"></div>

                <div class="jo_tabheadings">
                    <div class="jo_tabheading jo_active" data-target="jo_db_tree">DB (Baum)</div>
                    <!-- <div class="jo_tabheading" data-target="jo_db_list">DB (Liste)</div> -->
                </div>

                <div class="jo_tabs">

                    <div class="jo_tab jo_active jo_db_tree jo_scrollable">
                        Baum
                    </div>
                    <!-- <div class="jo_tab jo_db_list">
                        Liste
                    </div> -->



                </div>

            </div>



        </div>
    </div>

    <div id="dialog">
    </div>

</body>

</html>
